<!doctype html>
<html lang="uz"><head><meta charset="utf-8">
<!-- Montaj dvigateli: so'zma-so'z kinetik matn + sahna fonlari + karta-morph vaqtlari.
     capture.py bu faylni plan.json va scenes.html bilan birlashtirib work/page.html yaratadi (scenes.html body ichiga qo'yiladi). FAYLNI QO'LDA O'ZGARTIRMANG —
     video uchun maxsus narsa (UI-sahnalar) loyiha papkasidagi scenes.html ga yoziladi. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700;800&display=swap">
<style>
:root{--k-dark:#5aaeff;--k-light:#1f4de0;--ink:#14122b;--bg:#f4f2ec;--ui:#ff8a1f;--ui2:#ff6a00;--shade:4,6,28}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;background:transparent;overflow:hidden}
body{font-family:'Inter Tight','Helvetica Neue','Segoe UI',Arial,sans-serif;color:#fff;position:relative}
/* to'liq ekran kadrida pastki/yuqori qorayish (matn o'qilishi uchun) */
#vig{position:absolute;inset:0;z-index:1;background:linear-gradient(to top,rgba(var(--shade),.86) 0%,rgba(var(--shade),.66) 20%,rgba(var(--shade),.34) 36%,rgba(var(--shade),0) 54%),linear-gradient(to bottom,rgba(var(--shade),.35) 0%,rgba(var(--shade),0) 14%)}
/* sahna foni (video kartasi ostida) */
#bgL{position:absolute;inset:0;z-index:0}
.bgs{position:absolute;inset:0;display:none;background:radial-gradient(700px 520px at 88% 20%,rgba(255,138,31,.18),transparent 70%),radial-gradient(800px 600px at 8% 90%,rgba(75,59,255,.12),transparent 70%),var(--bg)}
.dots{position:absolute;inset:-60px;background-image:radial-gradient(rgba(20,18,43,.13) 3px,transparent 3.5px);background-size:60px 60px}
.ui{position:absolute;z-index:6;opacity:0}      /* scenes.html dagi HAR BIR obyekt shu klassga ega bo'lishi shart */
.dot{position:absolute;border-radius:50%;z-index:6;opacity:0}
/* kinetik matn */
.blk{position:absolute;left:0;width:1080px;bottom:330px;display:flex;flex-direction:column;align-items:center;gap:4px;z-index:10;pointer-events:none}
.blk.cap{bottom:300px}
.ln{display:flex;align-items:baseline;justify-content:center;gap:0;white-space:nowrap}
.w{paint-order:stroke fill;-webkit-text-stroke:5px rgba(8,8,28,.55);display:inline-block;margin:0 .14em;will-change:transform,filter,opacity;opacity:0;letter-spacing:-.035em;line-height:1.02;text-shadow:0 3px 22px rgba(0,0,12,.75)}
.w.s{font:400 42px 'Inter Tight',sans-serif;color:rgba(255,255,255,.82)}
.w.m{font:600 70px 'Inter Tight',sans-serif}
.w.k{font:700 104px 'Inter Tight',sans-serif;color:var(--k-dark);-webkit-text-stroke:9px rgba(5,8,32,.66);text-shadow:0 4px 18px rgba(0,0,12,.6)}
.cap .w.s{font-size:36px}.cap .w.m{font-size:50px}.cap .w.k{font-size:56px}
.lt .w{text-shadow:none;color:var(--ink);-webkit-text-stroke:0}
.lt .w.s{color:#4b4862}.lt .w.k{color:var(--k-light);text-shadow:none;-webkit-text-stroke:0}
/* hook: odam orqasidagi katta matn (alohida 'back' qatlam) */
.blk.back{bottom:auto;top:128px;gap:0}
.back .w.s{font:600 40px 'Inter Tight',sans-serif;letter-spacing:.02em;color:#fff}
.back .w.k{font:800 215px 'Inter Tight',sans-serif;line-height:.95;color:#8cc8ff;-webkit-text-stroke:13px rgba(5,8,32,.62);text-shadow:0 6px 24px rgba(0,0,12,.5)}
body.Lback #vig,body.Lback .ui,body.Lback .dot,body.Lback #bgL,body.Lback #stage{display:none}
body.Lbg > *:not(#bgL){display:none}
body.Lfg #bgL,body.Lfg #backstage{display:none}
</style>
</head><body>
<div id="bgL"></div>
<div id="vig"></div>
<!--SCENES_FRAGMENT-->
<div id="stage"></div><div id="backstage" style="position:absolute;inset:0;z-index:10"></div>
<script>
const PLAN=/*PLAN_JSON*/null;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const oExp=x=>x>=1?1:1-Math.pow(2,-10*x);
const oBack=x=>{const c1=1.70158,c3=c1+1;x=clamp(x);return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const ioCub=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const $=id=>document.getElementById(id);
const pop=(el,t,t0,o={})=>{if(!el)return;const x=clamp((t-t0)/(o.d||.4));const k=oBack(x);
  el.style.opacity=x>0?Math.min(1,x*3):0;
  el.style.transform=`translate(${(o.dx||0)*(1-oExp(x))}px,${(o.dy||0)*(1-oExp(x))}px) scale(${(o.s0||.6)+(1-(o.s0||.6))*k}) rotate(${(o.rot||0)*(1-oExp(x))}deg)`;
  el.style.filter=`blur(${(1-oExp(x))*8}px)`;};
const fadeOut=(el,t,t0,d=.3)=>{if(!el)return;const x=clamp((t-t0)/d); if(x>0){el.style.opacity=Math.min(parseFloat(el.style.opacity||1),1-x);}};
window.H={clamp,oExp,oBack,ioCub,pop,fadeOut,$};

/* ---- palitra ---- */
const P=PLAN.palette||{}; const R=document.documentElement.style;
if(P.accent_dark)R.setProperty("--k-dark",P.accent_dark); if(P.accent_light)R.setProperty("--k-light",P.accent_light);
if(P.ink)R.setProperty("--ink",P.ink); if(P.bg_light)R.setProperty("--bg",P.bg_light);
if(P.ui)R.setProperty("--ui",P.ui); if(P.ui2)R.setProperty("--ui2",P.ui2); if(P.shade)R.setProperty("--shade",P.shade);
if(P.hook_color){const st=document.createElement("style");st.textContent=`.back .w.k{color:${P.hook_color}!important}`;document.head.appendChild(st);}
const TX=PLAN.text||{bottom:330,cap_bottom:300,fit_width:880};
{const st=document.createElement("style");st.textContent=`.blk{bottom:${TX.bottom}px}.blk.cap{bottom:${TX.cap_bottom}px}`;document.head.appendChild(st);}

/* ---- sahna oynalari va karta progressi (compose.py dagi prog() bilan AYNAN BIR XIL) ---- */
const SC=(PLAN.scenes||[]).map(s=>[s.id,s.s,s.e]);
function prog(t){ for(const [,s,e] of SC){ const a=s-.20,b=s+.35,c=e-.40,d=e+.15;
  if(t>=a&&t<b) return ioCub((t-a)/(b-a)); if(t>=b&&t<c) return 1; if(t>=c&&t<=d) return 1-ioCub((t-c)/(d-c)); } return 0; }
for(const [id] of SC){ const b=document.createElement("div"); b.className="bgs"; b.id="bg_"+id; b.innerHTML='<div class="dots"></div>'; $("bgL").appendChild(b); }

/* ---- kinetik matn ----
   "~so'z" kichik, "*so'z" kalit (rangli, katta), oddiy = o'rta; "so'z@12.34" = so'z vaqti; "bir oy *nazariy" = oxirgisi kalit */
const stage=$("stage"), bstage=$("backstage"); const BL=[];
for(const p of PLAN.phrases){
  const blk=document.createElement("div"); blk.className="blk"+(p.cap?" cap":"")+(p.back?" back":"")+(p.lt?" lt":""); (p.back?bstage:stage).appendChild(blk);
  const words=[]; let tot=0;
  p.l.forEach(l=>l.forEach(w=>{tot+=w.replace(/@.*/,"").length+1}));
  let acc=0; const span=Math.max(.4,(p.e-p.s)-.35);
  p.l.forEach(line=>{
    const ln=document.createElement("div"); ln.className="ln"; blk.appendChild(ln);
    line.forEach(w=>{
      let t=null,txt=w; const m=w.match(/@([\d.]+)$/); if(m){t=parseFloat(m[1]);txt=w.replace(/@.*/,"")}
      if(t===null) t=p.s+span*acc/tot;
      let kmode=false;
      txt.split(" ").forEach((tk,ti)=>{
        let cls="m", tx=tk;
        if(tx[0]=="~"){cls="s";tx=tx.slice(1)} else if(tx[0]=="*"){cls="k";tx=tx.slice(1);kmode=true} else if(kmode){cls="k"}
        const el=document.createElement("span"); el.className="w "+cls; el.textContent=tx; ln.appendChild(el);
        words.push({el,t:t+ti*.001,cls});
      });
      acc+=txt.length+1;
    });
  });
  BL.push({p,blk,words});
}
function layout(){ for(const b of BL){ b.blk.querySelectorAll(".ln").forEach(ln=>{const w=ln.scrollWidth; ln.style.transform=w>TX.fit_width?`scale(${TX.fit_width/w})`:"";}); } }

window.renderFrame=function(t){
  for(const [id,s,e] of SC){ $("bg_"+id).style.display=(t>=s-.6&&t<=e+.6)?"block":"none"; }
  document.querySelectorAll(".dots").forEach(g=>{g.style.transform=`translate(${(t*14)%60}px,${(t*22)%60}px)`});
  $("vig").style.opacity=1-prog(t);
  if(window.sceneFrame) window.sceneFrame(t,window.H);          // loyihaning UI-sahnalari (scenes.html)
  for(const b of BL){
    const {p,words}=b; const inRange=t>=p.s-.05&&t<=p.e+.1;
    let q=0; if(!p.hold) q=clamp((t-(p.e-.16))/.16);
    for(const w of words){
      const x=clamp((t-w.t)/.30); const e=oExp(x);
      let tr="",fl="",op=0;
      if(inRange&&x>0){
        if(w.cls=="k"){ const bk=oBack(clamp((t-w.t)/.42)); const sc=1+(1-bk)*.45; const rot=(1-oExp(x))*-4;
          tr=`translateY(${(1-e)*30}px) scale(${sc}) rotate(${rot}deg)`; fl=`blur(${(1-e)*14}px)`; }
        else { tr=`translateY(${(1-e)*26}px) scale(${1+(1-e)*.14})`; fl=`blur(${(1-e)*12}px)`; }
        op=Math.min(1,x*2.4);
        if(q>0){ tr+=` translateY(${-14*q}px)`; fl=`blur(${q*8}px)`; op*=1-q }
      }
      w.el.style.opacity=op; w.el.style.transform=tr; w.el.style.filter=fl;
    }
  }
};
document.fonts.ready.then(()=>{ setTimeout(()=>{layout(); window.READY=true;},400); });
</script></body></html>
